# Пример файла настроек qwdtt-cli.
#
# Куда его класть:
#   Windows — %APPDATA%\qwdtt-cli\profiles.toml
#   Linux и macOS — $XDG_CONFIG_HOME/qwdtt-cli/profiles.toml (обычно ~/.config)
#   (под sudo — в каталоге того, кто вызвал sudo, а не root)
#
# Секретов в этом файле нет и быть не должно. Пароль подключения — это
# одновременно ключ маскировки трафика, поэтому он и хеши звонков хранятся
# отдельно, а здесь остаются только ссылки на них. Ссылки записывает
# `qwdtt-cli profile set`: он спрашивает значение скрытым вводом, чтобы секрет
# не попал в историю оболочки.

# Профиль, который берётся, когда имя не названо в командной строке.
# Если профиль в файле один, строку можно не писать.
default_profile = "home"

[profile.home]
# Адрес сервера в виде host:port. Обязателен.
peer = "203.0.113.10:56000"

# Ссылки на секреты. Обязательны; записываются командой
#   qwdtt-cli profile set home
password_ref  = "dpapi:8f2a1c"
vk_hashes_ref = "dpapi:1c9bd4"

# Как отдавать трафик:
#   tun      — свой адаптер qwdtt-cli, весь трафик системы (по умолчанию на Windows
#              и Linux); на Windows нужны права администратора и wintun.dll
#              рядом с qwdtt-cli, на Linux — sudo и ядро 5.12 или новее. Прежнее
#              имя wintun тоже принимается;
#   socks    — локальный SOCKS5, прав администратора не нужно (на macOS —
#              единственный режим и умолчание);
#   external — конфиг уходит штатному WireGuard, весь трафик системы (только
#              Windows); нужны права администратора и установленный WireGuard.
datapath = "tun"

# Kill-switch в tun и external: пока туннель не поднят — до первого подъёма
# и пока он переподключается, — трафик системы заблокирован, кроме самого qwdtt-cli,
# локальной сети и DHCP. false — выключить насовсем: тогда на это время трафик
# и DNS системы идут мимо туннеля. На один запуск выключает флаг
# -no-kill-switch. Что разрешено и как это видно — README, «Kill-switch».
# По умолчанию true.
kill_switch = true

# Число воркеров. Работают группами по девять, поэтому значение округляется
# вниз до кратного девяти; потолок — 108. По умолчанию 9.
workers = 18

# Режим RTP-маскировки: audio или video. Различаются типом полезной нагрузки
# и объёмом набивки. По умолчанию audio.
obfs = "audio"

# Транспорт до TURN-relay: udp или tcp. TCP помогает в сетях, где душат UDP.
# По умолчанию udp.
turn_transport = "udp"

# Поднимать ли DTLS поверх TURN. false означает прямой RTP-obfs AEAD: трафик
# всё равно шифруется и аутентифицируется, но сервер должен быть запущен
# с -listen-direct. По умолчанию true.
dtls = true

# Резолвер для доменов VK: yandex, cloudflare, google, doh-yandex,
# doh-cloudflare, doh-google, а также custom:<IP> и doh:<https-адрес>.
# По умолчанию yandex.
dns = "doh-yandex"

# Настройки локального SOCKS5. Учитываются при datapath = "socks".
[profile.home.socks]
listen = "127.0.0.1:1080"

# Второй профиль: тот же сервер, но трафик уходит штатному WireGuard.
# Ссылки на секреты у профилей свои — так пароль от рабочего сервера
# не утечёт в домашний профиль.
[profile.work]
peer           = "198.51.100.7:56000"
password_ref   = "dpapi:5d0e77"
vk_hashes_ref  = "dpapi:aa31b9"
datapath       = "external"
turn_transport = "tcp"
