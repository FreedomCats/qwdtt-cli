# Сборка и тесты на Windows. Раннер GitHub одноразовый и работает с правами
# администратора, поэтому здесь идут и тесты, которые без прав пропускаются:
# сессии WFP (winsys) и маршрут на TEST-NET-2 (monitor).
name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Перед сборкой релиза тесты зовёт release.yml.
  workflow_call:

permissions:
  contents: read

# github.workflow в вызове из release.yml — имя вызывающего («release»):
# без своего имени в группе windows.yml и linux.yml попали бы в одну группу,
# и второй отменил бы первый.
concurrency:
  group: ${{ github.workflow }}-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
    steps:
      # Действия закреплены по хешу коммита: тег можно перевесить.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...
