# Сборка и тесты на Linux. Тесты идут от обычного пользователя: так их
# запускает разработчик, и тест, который полез бы за правами (sudo), здесь
# упадёт, а не пройдёт незаметно, как на раннере Windows с правами.
# Тесты, которые меняют сеть (QWDTT_TEST_NETNS), — отдельным заданием в
# контейнере: на самом раннере они перекладывали бы его маршрут по умолчанию.
name: linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Перед сборкой релиза тесты зовёт release.yml.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Действия закреплены по хешу коммита: тег можно перевесить.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go build
        run: CGO_ENABLED=0 go build ./...

      - name: go vet
        run: go vet ./...

      # Тесты связки ключей поднимают свой dbus-daemon; без него они бы
      # пропустились, а QWDTT_TEST_DBUS делает пропуск провалом.
      - name: dbus-daemon
        run: command -v dbus-daemon || { sudo apt-get update && sudo apt-get install -y dbus-daemon; }

      # -race нужен cgo, поэтому CGO_ENABLED здесь не выключен.
      - name: go test -race
        env:
          QWDTT_TEST_DBUS: '1'
        run: go test -race -count=1 ./...

  # Новый интерфейс, маршрут по умолчанию, nftables, TUN — в своём сетевом
  # пространстве контейнера, как локально (plan-e4.md).
  netns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      # ubuntu:latest, закреплённый по хешу.
      IMAGE: ubuntu@sha256:d1e2e92c075e5ca139d51a140fff46f84315c0fdce203eab2807c7e495eff4f9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Сборка тестов
        run: |
          mkdir -p build/out
          go test -c -o build/out/linuxsys.test ./internal/linuxsys
          go test -c -o build/out/datapath.test ./internal/datapath

      # Пропуск здесь — тоже провал: значит, проверки сети не шли вовсе.
      - name: Тесты в контейнере
        run: |
          set -o pipefail
          for pkg in linuxsys datapath; do
            docker run --rm --cap-add NET_ADMIN --device /dev/net/tun \
              -e QWDTT_TEST_NETNS=1 -v "$PWD/build/out":/qwdtt-cli:ro "$IMAGE" \
              "/qwdtt-cli/$pkg.test" -test.count=1 -test.v | tee "build/out/$pkg.log"
            if grep -- '--- SKIP' "build/out/$pkg.log"; then
              echo "::error::$pkg: тесты пропущены"
              exit 1
            fi
          done
