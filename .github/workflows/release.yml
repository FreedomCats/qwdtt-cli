# Релиз: тесты на Windows и Linux, сборка scripts/release и черновик
# GitHub Release с архивами, SHA256SUMS.txt и блоком «Скачать» в описании.
#
# Тег v* — сборка и черновик релиза с этим тегом; опубликовать черновик —
# вручную, на странице Releases. Ручной запуск (workflow_dispatch) только
# собирает: архивы остаются артефактом прогона, релиз не создаётся.
#
# Сборка идёт на Windows: там scripts/release проверяет и хеш архива Wintun,
# и подпись wintun.dll (WinVerifyTrust есть только на Windows).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/windows.yml

  test-linux:
    uses: ./.github/workflows/linux.yml

  build:
    needs: [test, test-linux]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Вся история с тегами: без неё git describe в scripts/release
      # не найдёт тег при ручном запуске.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Шаги — команды Go из scripts/, оболочка — bash: кода на PowerShell
      # в проекте нет.
      - name: Сборка
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            go run ./scripts/release -version "$GITHUB_REF_NAME"
          else
            go run ./scripts/release
          fi

      # В архиве — всё, что нужно для запуска у пользователя: без wintun.dll
      # не работает режим tun, без README не понять, с чего начать. Выпал
      # файл — релиза нет. qwdtt-cli.exe из распакованного zip запускается,
      # у qwdtt-cli в tar.gz — право на исполнение.
      - name: Состав архивов
        shell: bash
        run: go run ./scripts/distcheck -dir dist

      # Переводы строк — LF: так файл проверяет и `sha256sum -c` на Linux.
      - name: SHA256SUMS.txt
        shell: bash
        run: go run ./scripts/sha256sums -dir dist

      # Начало описания релиза — ссылки в порядке Windows, Linux, macOS,
      # исходники, суммы: список ассетов GitHub сортирует по алфавиту, и
      # порядок задаётся только описанием над ним. Файл — вне dist, иначе
      # он ушёл бы в релиз ассетом.
      - name: Описание релиза
        shell: bash
        run: go run ./scripts/releasenotes -dir dist -repo "$GITHUB_REPOSITORY" -out release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: release-notes.md
          if-no-files-found: error

  # Право на запись — только у этого задания: оно не запускает ни кода
  # репозитория, ни скачанного, только выкладывает готовые архивы.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes

      # Описание — блок «Скачать» из сборки, под ним — что изменилось
      # (--generate-notes дописывает своё после --notes-file).
      - name: Черновик релиза
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes/release-notes.md \
            --generate-notes
